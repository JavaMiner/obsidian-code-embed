name: Release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build && npm test && node --check dist/main.js
      - run: test "$GITHUB_REF_NAME" = "$(node -p 'require("./manifest.json").version')"
      - run: gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css --verify-tag --generate-notes --draft
        env:
          GH_TOKEN: ${{ github.token }}
