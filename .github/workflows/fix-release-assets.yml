name: Publish 0.3.6 with verified assets
on:
  push:
    branches: ['fix/release-0.3.2-assets']
    paths: ['.github/workflows/fix-release-assets.yml']
permissions:
  contents: read
concurrency:
  group: code-embed-release-0.3.6
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release base and tag
        run: |
          test "$(git rev-parse HEAD)" = 1c4394b26b00ab296107766e5e5c4e20607a16fc
          existing_tag="$(git ls-remote --tags origin refs/tags/0.3.6)"
          test -z "$existing_tag"
      - run: npm ci
      - run: npm version 0.3.6 --no-git-tag-version && npm run version:sync
      - name: Commit version and validate build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json manifest.json versions.json
          git commit -m 'chore: release 0.3.6'
          npm run lint && npm run build && npm test && node --check dist/main.js
          node -e 'for (const file of ["./package.json", "./manifest.json", "./dist/manifest.json"]) if (require(file).version !== "0.3.6") throw Error(file)'
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Verify provenance and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for file in main.js manifest.json styles.css; do
            gh attestation verify "dist/$file" -R "$GITHUB_REPOSITORY"
          done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 1c4394b26b00ab296107766e5e5c4e20607a16fc
          git push origin HEAD:main
          gh release create 0.3.6 dist/main.js dist/manifest.json dist/styles.css --target "$(git rev-parse HEAD)" --title 0.3.6 --generate-notes --draft
          gh release download 0.3.6 --dir "$RUNNER_TEMP/release-assets"
          for file in main.js manifest.json styles.css; do
            cmp "dist/$file" "$RUNNER_TEMP/release-assets/$file"
          done
          gh release edit 0.3.6 --draft=false --latest
