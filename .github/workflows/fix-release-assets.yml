name: Advanced appearance in action modal
on:
  push:
    branches: ['fix/release-0.3.2-assets']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/advanced-appearance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch views.ts
        run: |
          python3 - <<'PY'
          def sub(path, old, new):
              s = open(path, encoding='utf-8').read()
              assert s.count(old) == 1, (path, old)
              open(path, 'w', encoding='utf-8', newline='').write(s.replace(old, new))
          v = 'src/views.ts'
          sub(v, '  private advancedGroup(): SettingsGroup {', '  private advancedGroup(refresh: () => void = () => this.refreshSettings()): SettingsGroup {')
          sub(v, '                      await this.set("showAdvancedAppearance", value);\n                      this.refreshSettings();', '                      await this.set("showAdvancedAppearance", value);\n                      refresh();')
          sub(v, '                        this.plugin.applyColors();\n                        this.refreshSettings();', '                        this.plugin.applyColors();\n                        refresh();')
          sub(v, '      new Setting(modal.contentEl).addButton((btn) =>\n        btn.setButtonText("+ " + t("addFormat"))', '      new Setting(modal.contentEl).setName(t("advancedAppearance")).setHeading();\n      for (const control of this.advancedGroup(render).items) {\n        const row = new Setting(modal.contentEl).setName(control.name);\n        if (control.desc) row.setDesc(control.desc);\n        control.render(row);\n      }\n      new Setting(modal.contentEl).addButton((btn) =>\n        btn.setButtonText("+ " + t("addFormat"))')
          PY
      - run: git diff --stat
      - name: Lint, build and test
        id: check
        run: |
          set +e
          (npm ci && npm run lint && npm run build && npm test) > /tmp/ci.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          tail -n 60 /tmp/ci.log
      - name: Commit and push when green
        if: steps.check.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: show advanced appearance in the block and note settings modal"
          git push origin HEAD:feat/advanced-appearance
      - name: Publish log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/ci.log "$RUNNER_TEMP/ci.log" 2>/dev/null || echo "no log" > "$RUNNER_TEMP/ci.log"
          git checkout --orphan ci-log
          git rm -rf -q .
          cp "$RUNNER_TEMP/ci.log" ci.log
          git add ci.log
          git commit -m "ci log"
          git push -f origin ci-log
