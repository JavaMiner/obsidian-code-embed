name: Publish 0.3.5 with provenance
on:
  push:
    branches: ['fix/release-0.3.2-assets']
    paths: ['.github/workflows/fix-release-assets.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release base
        run: |
          test "$(git rev-parse HEAD)" = 55c8afc69693d321daf730c78a9d33d5570db169
          test -z "$(git ls-remote --tags origin refs/tags/0.3.5)"
      - run: npm ci
      - run: npm version 0.3.5 --no-git-tag-version && npm run version:sync
      - run: npm run lint && npm run build && npm test && node --check dist/main.js
      - name: Commit tested release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json manifest.json versions.json
          git commit -m 'chore: release 0.3.5'
          git push origin HEAD:main
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Verify provenance and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for file in main.js manifest.json styles.css; do
            gh attestation verify "dist/$file" -R "$GITHUB_REPOSITORY"
          done
          gh release create 0.3.5 dist/main.js dist/manifest.json dist/styles.css --target "$(git rev-parse HEAD)" --title 0.3.5 --generate-notes --draft
          gh release download 0.3.5 --dir "$RUNNER_TEMP/release-assets"
          for file in main.js manifest.json styles.css; do
            cmp "dist/$file" "$RUNNER_TEMP/release-assets/$file"
          done
          gh release edit 0.3.5 --draft=false --latest
