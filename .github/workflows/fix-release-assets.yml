name: Advanced appearance in action modal
on:
  push:
    branches: ['fix/release-0.3.2-assets']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/advanced-appearance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch views.ts
        run: |
          python3 - <<'PY'
          import textwrap
          v = 'src/views.ts'
          s = open(v, encoding='utf-8').read()
          a = s.index('  private pxSlider(')
          b = s.index('  getSettingDefinitions(): SettingsGroup[] {')
          BLOCK = textwrap.dedent('''\
          private pxSlider(
            key: KeysOfType<number>,
            name: string,
            max: number,
            step: number,
          ): SettingsRow {
            return this.slider(key, name, t("zeroDefaultHelp"), 0, max, step);
          }

          private advancedGroup(refresh: () => void = () => this.refreshSettings()): SettingsGroup {
            const items: SettingsRow[] = [
              {
                name: t("showAdvancedAppearance"),
                desc: t("showAdvancedAppearanceHelp"),
                render: (row) => {
                  row.addToggle((toggle) =>
                    toggle
                      .setValue(this.plugin.settings.showAdvancedAppearance)
                      .onChange(async (value) => {
                        await this.set("showAdvancedAppearance", value);
                        refresh();
                      }),
                  );
                },
              },
            ];
            if (this.plugin.settings.showAdvancedAppearance) {
              items.push(
                this.pxSlider("copyGutter", t("copyGutter"), 120, 4),
                this.pxSlider("actionFont", t("actionFont"), 24, 1),
                this.pxSlider("actionGap", t("actionGap"), 24, 1),
                this.pxSlider("childIndent", t("childIndent"), 48, 2),
                this.pxSlider("mobileTouch", t("mobileTouch"), 72, 4),
                this.pxSlider("mobileGap", t("mobileGap"), 24, 1),
                this.pxSlider("mobileTop", t("mobileTop"), 64, 4),
                {
                  name: t("resetAppearance"),
                  desc: t("resetAppearanceHelp"),
                  render: (row) => {
                    row.addButton((button) =>
                      button.setButtonText(t("reset")).onClick(async () => {
                        Object.assign(this.plugin.settings, {
                          copyGutter: 0,
                          actionFont: 0,
                          actionGap: 0,
                          childIndent: 0,
                          mobileTouch: 0,
                          mobileGap: 0,
                          mobileTop: 0,
                        });
                        await this.plugin.saveData(this.plugin.settings);
                        this.plugin.applyColors();
                        refresh();
                      }),
                    );
                  },
                },
              );
            }
            return { type: "group", heading: t("advancedAppearance"), items };
          }

          ''')
          BLOCK = ''.join(('  ' + l if l.strip() else l) for l in BLOCK.splitlines(True))
          s = s[:a] + BLOCK + s[b:]
          old = '      new Setting(modal.contentEl).addButton((btn) =>\n        btn.setButtonText("+ " + t("addFormat"))'
          assert s.count(old) == 1
          modal = '      new Setting(modal.contentEl).setName(t("advancedAppearance")).setHeading();\n      for (const control of this.advancedGroup(render).items) {\n        const row = new Setting(modal.contentEl).setName(control.name);\n        if (control.desc) row.setDesc(control.desc);\n        control.render(row);\n      }\n'
          s = s.replace(old, modal + old)
          open(v, 'w', encoding='utf-8', newline='').write(s)
          PY
      - run: git diff --stat
      - name: Lint, build and test
        id: check
        run: |
          set +e
          (npm ci && npm run lint && npm run build && npm test) > /tmp/ci.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          tail -n 60 /tmp/ci.log
      - name: Commit and push when green
        if: steps.check.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: show advanced appearance in the block and note settings modal"
          git push origin HEAD:feat/advanced-appearance
      - name: Publish log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/ci.log "$RUNNER_TEMP/ci.log" 2>/dev/null || echo "no log" > "$RUNNER_TEMP/ci.log"
          git checkout --orphan ci-log
          git rm -rf -q .
          cp "$RUNNER_TEMP/ci.log" ci.log
          git add ci.log
          git commit -m "ci log"
          git push -f origin ci-log
