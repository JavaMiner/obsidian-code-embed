name: Restore folder root context menu
on:
  push:
    branches: [feature/canonical-embeds-packages]
    paths: [scripts/restore-root-menu.cjs]
permissions:
  contents: write
jobs:
  restore:
    if: github.repository == 'JavaMiner/obsidian-code-embed' && github.ref == 'refs/heads/feature/canonical-embeds-packages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-embeds-packages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/restore-root-menu.cjs
      - run: npm run build && npm test && node --check dist/main.js
      - name: Commit tested menu fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js test/startup.test.cjs
          git commit -m 'Restore folder root actions on reused context menus'
          git push origin HEAD:feature/canonical-embeds-packages
      - uses: actions/upload-artifact@v4
        with:
          name: code-embed-root-menu-fix
          path: dist/
          if-no-files-found: error
