name: Apply guarded embed UI fixes
on:
  push:
    branches: [feature/canonical-embeds-packages]
    paths:
      - scripts/apply-embed-ui-fixes.cjs
      - test/release-validation.test.cjs
      - .github/workflows/apply-embed-ui-fixes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'JavaMiner/obsidian-code-embed' && github.ref == 'refs/heads/feature/canonical-embeds-packages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canonical-embeds-packages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-embed-ui-fixes.cjs
      - run: npm run build
      - run: npm test
      - run: node --check dist/main.js
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/locales.js scripts/build.cjs styles.css README.pl.md CONTRIBUTING.md test/startup.test.cjs test/embed-ui-fixes.test.cjs
          git commit -m 'Extract locales, expand named shortcuts and show only the active root'
          git push origin HEAD:feature/canonical-embeds-packages
