name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: node --check dist/main.js
      - uses: actions/upload-artifact@v4
        with:
          name: code-embed-development
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: code-embed-smoke-vault
          path: examples/smoke-vault/
          if-no-files-found: error
